name: Checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
env:
  POKER_MARKET_DATA: "0"
permissions:
  contents: read
concurrency:
  group: checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  core:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m unittest discover -s tests/python -t . -v
      - run: node scripts/check-js.cjs
      - run: node scripts/check-docs.cjs
      - run: python scripts/check-ui-assets.py
      - run: python scripts/check-container.py
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: node scripts/vendor-market-chart.cjs --check
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run test:ui
      - run: npm run test:journeys
      - run: npm run test:rewards
      - run: npm run test:market
      - run: npm run test:contracts
      - run: npm run test:bank
      - run: npm run test:cards
      - run: npm run test:limits
      - run: npm run test:reveal
      - run: npm run test:layout
      - run: npm run test:motion
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: synthetic-browser-diagnostics
          path: |
            artifacts/browser
            artifacts/table-ux
            artifacts/rewards
            artifacts/market/browser
            artifacts/market/contracts-browser
            artifacts/bank/browser
            artifacts/bet-limit-browser
            artifacts/cards
            artifacts/layout
            artifacts/art-motion
            artifacts/round-presentation
          retention-days: 7
  release:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [core, browser]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: python scripts/build_release.py
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ github.sha }}
          path: artifacts/release/
          retention-days: 7
          if-no-files-found: error
