name: Checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  core:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m unittest discover -v
      - run: node scripts/check-js.cjs
      - run: node scripts/check-docs.cjs
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run test:ui
      - run: npm run test:layout
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: synthetic-browser-diagnostics
          path: |
            artifacts/browser
            artifacts/layout
          retention-days: 7
  release:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [core, browser]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: python scripts/build_release.py
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ github.sha }}
          path: artifacts/release/
          retention-days: 7
          if-no-files-found: error
