name: nantuan-poker-dev

services:
  poker:
    build: .
    image: nantuan-poker:dev
    restart: unless-stopped
    init: true
    ports:
      - "127.0.0.1:${POKER_PORT:-8765}:8765"
    environment:
      POKER_DB: /data/poker.sqlite3
      POKER_SECURE_COOKIE: ${POKER_SECURE_COOKIE:-0}
      POKER_PUBLIC_ORIGIN: ${POKER_PUBLIC_ORIGIN:-}
      POKER_REQUIRE_INVITE: ${POKER_REQUIRE_INVITE:-0}
      POKER_MARKET_DATA: ${POKER_MARKET_DATA:-1}
      POKER_MARKETSTACK_KEY: ${POKER_MARKETSTACK_KEY:-}
      TZ: Asia/Taipei
    volumes:
      - poker_dev_data:/data
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    mem_limit: 256m
    cpus: 1.0
    stop_grace_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"

volumes:
  poker_dev_data:
